<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" width="600" height="1000" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1b3263"/>
      <stop offset="0.6" stop-color="#122245"/>
      <stop offset="1" stop-color="#0a1329"/>
    </linearGradient>
    <radialGradient id="gTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1fe5d8" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#1fe5d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gIndigo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c8bff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7c8bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tealBack" x1="0" y1="0" x2="1" y2="1">
